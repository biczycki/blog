---
layout: default
---
<article class="post">
  
  <!-- 1. Der Titel des Blogposts -->
  <h1>{{ page.title }}</h1>
  
  <!-- 2. Das Datum -->
  <p class="post-meta"><time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%d.%m.%Y" }}</time></p>

  <!-- 3. Unser Vorlese-Button (wird auf JEDER Seite angezeigt) -->
  <button id="tts-button" onclick="toggleSpeech()" style="padding: 10px 20px; font-size: 16px; cursor: pointer; background-color: #007bff; color: white; border: none; border-radius: 5px; margin-bottom: 20px;">📄 Artikel vorlesen</button>

  <!-- 4. WICHTIG: Das umschließende Div für den Inhalt -->
  <div id="article-content" class="post-content">
    {{ content }}
  </div>

</article>

<!-- 5. Das JavaScript für die Vorlesefunktion -->
<script>
let synth = window.speechSynthesis;
let speechQueue = [];
let currentQueueIndex = 0;
let isSpeaking = false;

function toggleSpeech() {
  const button = document.getElementById('tts-button');
  const articleElement = document.getElementById('article-content');

  if (!articleElement) return;

  // Wenn es läuft -> Stoppen und alles zurücksetzen
  if (isSpeaking) {
    synth.cancel();
    resetTTS(button);
    return;
  }

  // Radikaler Reset vor dem Start
  synth.cancel();

  // Text holen und bereinigen
  let rawText = articleElement.innerText.trim();
  
  // Text in Sätze zerlegen (trennt bei ., ! und ?)
  // Schließt leere Einträge aus
  speechQueue = rawText.split(/[.!?]+/).map(s => s.trim()).filter(s => s.length > 1);

  if (speechQueue.length === 0) {
    alert("Kein lesbarer Text gefunden.");
    return;
  }

  currentQueueIndex = 0;
  isSpeaking = true;
  button.innerText = "⏹️ Vorlesen stoppen";

  // Erste Zeile sprechen
  playNextChunk(button);
}

function playNextChunk(button) {
  if (currentQueueIndex >= speechQueue.length) {
    resetTTS(button);
    return;
  }

  let textToSpeak = speechQueue[currentQueueIndex];

  // Sicherheits-Filter: Ignoriere reine hebräische/fremde Zeichenblöcke im Satz
  // Erlaubt lateinische Buchstaben, Zahlen und deutsche Umlaute
  if (!/[a-zA-Z0-9äöüÄÖÜß]/.test(textToSpeak)) {
    currentQueueIndex++;
    playNextChunk(button);
    return;
  }

  let utterance = new SpeechSynthesisUtterance(textToSpeak);
  utterance.lang = 'de-DE';

  // Männliche Stimme suchen
  const voices = synth.getVoices();
  const maleVoiceNames = ['Stefan', 'Google Deutsch', 'Microsoft Stefan', 'Yannick', 'Markus'];
  let selectedVoice = voices.find(voice => voice.lang.startsWith('de') && maleVoiceNames.some(name => voice.name.includes(name)));
  if (!selectedVoice) selectedVoice = voices.find(voice => voice.lang.startsWith('de'));
  if (selectedVoice) utterance.voice = selectedVoice;

  // Wenn dieser Satz fertig ist -> den nächsten abspielen
  utterance.onend = function() {
    currentQueueIndex++;
    playNextChunk(button);
  };

  // Fehler-Absicherung für den einzelnen Satz
  utterance.onerror = function(e) {
    console.warn("Satz-Fehler übersprungen:", e.error);
    currentQueueIndex++;
    playNextChunk(button);
  };

  synth.speak(utterance);
}

function resetTTS(button) {
  button.innerText = "📄 Artikel vorlesen";
  isSpeaking = false;
  speechQueue = [];
  currentQueueIndex = 0;
}

if (speechSynthesis.onvoiceschanged !== undefined) {
  speechSynthesis.onvoiceschanged = synth.getVoices;
}
</script>
