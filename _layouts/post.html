---
layout: default
---
<article class="post">
  
  <!-- 1. Der Titel des Blogposts -->
  <h1>{{ page.title }}</h1>
  
  <!-- 2. Das Datum -->
  <p class="post-meta"><time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%d.%m.%Y" }}</time></p>

  <!-- 3. Unser Vorlese-Button (wird auf JEDER Seite angezeigt) -->
  <button id="tts-button" onclick="toggleSpeech()" style="padding: 10px 20px; font-size: 16px; cursor: pointer; background-color: #007bff; color: white; border: none; border-radius: 5px; margin-bottom: 20px;">📄 Artikel vorlesen</button>

  <!-- 4. WICHTIG: Das umschließende Div für den Inhalt -->
  <div id="article-content" class="post-content">
    {{ content }}
  </div>

</article>

<!-- 5. Das JavaScript für die Vorlesefunktion -->
<script>
let synth = window.speechSynthesis;
let utterance = null;
let isSpeaking = false;

function toggleSpeech() {
  const button = document.getElementById('tts-button');
  const articleElement = document.getElementById('article-content');

  if (!articleElement) {
    alert("Layout-Fehler: 'article-content' nicht gefunden.");
    return;
  }

  // 1. WICHTIG: Wenn es bereits läuft, stoppen und resetten
  if (isSpeaking) {
    synth.cancel();
    button.innerText = "📄 Artikel vorlesen";
    isSpeaking = false;
    return;
  }

  // Radikaler Reset vor jedem neuen Start (löst Blockaden im Browser)
  synth.cancel();

  // 2. Text holen und von unsichtbaren Zeichen/Zeilenumbrüchen säubern
  let articleText = articleElement.innerText
    .replace(/\s+/g, ' ') // Ersetzt mehrfache Leerzeichen/Umbrüche durch ein einzelnes Leerzeichen
    .trim();
  
  if (articleText.length === 0) {
    alert("Kein Text vorhanden.");
    return;
  }

  utterance = new SpeechSynthesisUtterance(articleText);
  utterance.lang = 'de-DE';

  // Stimmen-Auswahl
  try {
    const voices = synth.getVoices();
    const maleVoiceNames = ['Stefan', 'Google Deutsch', 'Microsoft Stefan', 'Yannick', 'Markus'];
    
    let selectedVoice = voices.find(voice => 
      voice.lang.startsWith('de') && 
      maleVoiceNames.some(name => voice.name.includes(name))
    );

    if (!selectedVoice) {
      selectedVoice = voices.find(voice => voice.lang.startsWith('de'));
    }

    if (selectedVoice) {
      utterance.voice = selectedVoice;
    }
  } catch (e) {
    console.log("Stimmen-Auswahl nicht möglich.");
  }

  // Event-Handler
  utterance.onend = function() {
    button.innerText = "📄 Artikel vorlesen";
    isSpeaking = false;
  };

  utterance.onerror = function(event) {
    console.error("Fehler beim Vorlesen:", event.error);
    // Wenn es trotz allem blockiert, erzwingen wir einen Reset
    synth.cancel();
    button.innerText = "📄 Artikel vorlesen";
    isSpeaking = false;
  };

  // 3. Startbefehl absenden
  synth.speak(utterance);
  button.innerText = "⏹️ Vorlesen stoppen";
  isSpeaking = true;
}

// Stimmen im Hintergrund laden
if (speechSynthesis.onvoiceschanged !== undefined) {
  speechSynthesis.onvoiceschanged = synth.getVoices;
}
</script>
