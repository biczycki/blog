---
layout: default
---
<article class="post">
  
  <!-- 1. Der Titel des Blogposts -->
  <h1>{{ page.title }}</h1>
  
  <!-- 2. Das Datum -->
  <p class="post-meta"><time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%d.%m.%Y" }}</time></p>

  <!-- 3. Unser Vorlese-Button (wird auf JEDER Seite angezeigt) -->
  <button id="tts-button" onclick="toggleSpeech()" style="padding: 10px 20px; font-size: 16px; cursor: pointer; background-color: #007bff; color: white; border: none; border-radius: 5px; margin-bottom: 20px;">📄 Artikel vorlesen</button>

  <!-- 4. WICHTIG: Das umschließende Div für den Inhalt -->
  <div id="article-content" class="post-content">
    {{ content }}
  </div>

</article>

<!-- 5. Das JavaScript für die Vorlesefunktion -->
<script>
let synth = window.speechSynthesis;
let utterance = null;
let isSpeaking = false;

function toggleSpeech() {
  const button = document.getElementById('tts-button');
  
  if (isSpeaking) {
    synth.cancel();
    button.innerText = "📄 Artikel vorlesen";
    isSpeaking = false;
    return;
  }

  const articleText = document.getElementById('article-content').innerText;
  utterance = new SpeechSynthesisUtterance(articleText);

  // --- STIMMEN-AUSWAHL START ---
  // Alle auf dem Gerät verfügbaren Stimmen laden
  const voices = synth.getVoices();
  
  // Liste bekannter männlicher deutscher Stimmen-Namen (Systemabhängig)
  const maleVoiceNames = ['Stefan', 'Google Deutsch', 'Microsoft Stefan', 'Yannick', 'Markus'];
  
  // Suchen nach einer passenden deutschen, männlichen Stimme
  let selectedVoice = voices.find(voice => 
    voice.lang.startsWith('de') && 
    maleVoiceNames.some(name => voice.name.includes(name))
  );

  // Falls keine explizit männliche gefunden wurde, nimm die erste deutsche Stimme als Backup
  if (!selectedVoice) {
    selectedVoice = voices.find(voice => voice.lang.startsWith('de'));
  }

  // Stimme dem Vorleser zuweisen
  if (selectedVoice) {
    utterance.voice = selectedVoice;
  }
  // --- STIMMEN-AUSWAHL ENDE ---

  utterance.onend = function() {
    button.innerText = "📄 Artikel vorlesen";
    isSpeaking = false;
  };

  synth.speak(utterance);
  button.innerText = "⏹️ Vorlesen stoppen";
  isSpeaking = true;
}

// Wichtig für einige Browser (z.B. Chrome), damit die Stimmen vorab geladen werden
if (speechSynthesis.onvoiceschanged !== undefined) {
  speechSynthesis.onvoiceschanged = synth.getVoices;
}
</script>
